name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # scripts/*.js use node --env-file, which needs >= 20.6
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The baseline is zero errors. Any error is new — see
      # src/test/dbMock.ts for the postgres result-mock helper.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every test mocks the database, so no Postgres service is needed here.
      - name: Test
        run: npm test

  # A separate job so the build runs alongside verify rather than after it:
  # CI wall-clock stays roughly the slower of the two instead of their sum, and
  # a broken build is reported distinctly from a failing test.
  build:
    runs-on: ubuntu-latest

    env:
      # next build runs as NODE_ENV=production, and src/lib/requiredSecret.ts
      # deliberately fails closed there rather than defaulting to the
      # development constant published in this repo. A throwaway CI value,
      # same as the browser-checks job below — it never reaches a deployment.
      # The two encryption keys are read lazily at first use, so a build does
      # not need them.
      SESSION_SECRET: ci-only-secret-not-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next build runs checks tsc --noEmit cannot: the generated .next/types
      # only exist during a build, so a route whose props violate PageProps
      # passes typecheck and fails at deploy.
      - name: Build
        run: npm run build

  # EP-010 BUG-006 (cross-device regression) + BUG-011 (Core Web Vitals gate).
  # One job because both need the same expensive setup the unit suite avoids:
  # a real Postgres, a real build, and a really-running app.
  browser-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visionnova
          POSTGRES_PASSWORD: visionnova
          POSTGRES_DB: visionnova
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://visionnova:visionnova@localhost:5432/visionnova
      SESSION_SECRET: ci-only-secret-not-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Set up database
        run: node scripts/setup-db.js

      - name: Seed database
        run: node scripts/seed-db.js

      - name: Build
        run: npm run build

      # Each tool manages its own server lifecycle against the production
      # build: playwright.config.ts starts `npm run start` when CI is set,
      # and lighthouserc.json declares its own startServerCommand.
      - name: Cross-device e2e (BUG-006)
        run: npm run test:e2e

      - name: Lighthouse Core Web Vitals (BUG-011)
        run: npx --no-install lhci autorun
