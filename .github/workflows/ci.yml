name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # scripts/*.js use node --env-file, which needs >= 20.6
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The baseline is zero errors. Any error is new — see
      # src/test/dbMock.ts for the postgres result-mock helper.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every test mocks the database, so no Postgres service is needed here.
      - name: Test
        run: npm test
